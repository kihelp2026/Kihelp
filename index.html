<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>KiHelp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#14211f; --mute:#58686a; --line:#dbe5e5; --paper:#eef5f5; --card:#fff;
  --acc:#0e6b6b; --acc-ink:#fff; --soft:#d3ebe8; --coral:#e2573b;
  --disp:"Bricolage Grotesque",system-ui,sans-serif; --body:"Figtree",system-ui,sans-serif;
}
body.market{ --paper:#fdf5d3; --line:#eadfae; --acc:#f0a800; --acc-ink:#241800; --soft:#fbe2a0; --mute:#6b5f38; --ink:#241c06; }
body.dark{ --ink:#e6f0ef; --paper:#0e1616; --card:#172322; --line:#283a39; --mute:#8fa5a3; --acc:#33b8b0; --acc-ink:#03201f; --soft:#17403e; background:#050909; }
body.dark.market{ --paper:#17130a; --card:#221c0d; --line:#3a3114; --ink:#f6edd0; --mute:#b3a577; --acc:#f5b72a; --acc-ink:#241800; --soft:#4a3a0c; }
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font:16px/1.45 var(--body);color:var(--ink);background:#c9d3d3;transition:background .3s}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;text-align:inherit}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px;border-radius:6px}
svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

#app{position:relative;max-width:480px;height:100dvh;margin:0 auto;background:var(--paper);display:flex;flex-direction:column;overflow:hidden;transition:background .3s}
#head{display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 12px) 16px 10px;background:var(--paper);border-bottom:1px solid var(--line)}
.mark{font:800 26px/1 var(--disp);letter-spacing:-.03em}
.sect{font:600 13px var(--body);color:var(--mute);margin-top:3px}
.hbtn{display:flex;align-items:center;gap:6px;padding:9px 14px;border-radius:999px;background:var(--acc);color:var(--acc-ink);font-weight:600}
.ibtn{width:42px;height:42px;display:grid;place-items:center;border-radius:50%}
#main{flex:1;overflow-y:auto;padding-bottom:16px;scroll-behavior:smooth}

#nav{display:flex;background:var(--card);border-top:1px solid var(--line);padding:6px 4px calc(env(safe-area-inset-bottom) + 6px)}
#nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--mute);padding:2px 0}
#nav .pill{display:grid;place-items:center;width:52px;height:30px;border-radius:999px;transition:background .2s}
#nav button.on{color:var(--ink)}
#nav button.on .pill{background:var(--acc);color:var(--acc-ink)}
.dot{position:relative}.dot::after{content:"";position:absolute;top:-2px;right:-3px;width:9px;height:9px;border-radius:50%;background:var(--coral);border:2px solid var(--card)}

/* avatars + placeholder photos */
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none;font:700 16px var(--disp);color:#fff;background:hsl(var(--h) 50% 38%)}
.ph{background:radial-gradient(circle at 25% 30%,hsl(var(--h) 80% 78%) 0 14%,transparent 15%),linear-gradient(135deg,hsl(var(--h) 55% 58%),hsl(calc(var(--h) + 45) 55% 34%))}
img.m,video.m{width:100%;display:block;object-fit:cover}

/* stories */
.stories{display:flex;gap:14px;padding:14px 16px;overflow-x:auto;border-bottom:1px solid var(--line);scrollbar-width:none}
.story{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:12px;font-weight:500;flex:none;width:64px}
.ring{padding:3px;border-radius:50%;background:conic-gradient(var(--acc),var(--coral),var(--acc))}
.ring .av{border:3px solid var(--paper);width:56px;height:56px}
.ring.add{background:none;border:2px dashed var(--mute)}
.ring.add .av{background:var(--soft);color:var(--ink);border:0}

/* posts: full-bleed, hairline separated like a real feed */
.post{padding:14px 0 6px;border-bottom:1px solid var(--line)}
.ph-row{display:flex;gap:10px;align-items:center;padding:0 16px}
.ph-row b{display:block;line-height:1.2}.ph-row small{color:var(--mute)}
.ptext{padding:10px 16px 10px}
.pmedia{aspect-ratio:4/3;width:100%}
.acts{display:flex;gap:4px;padding:4px 10px}
.acts button{display:flex;gap:6px;align-items:center;padding:8px 10px;border-radius:999px;color:var(--mute);font-weight:600;font-size:14px}
.acts button.on{color:var(--coral)}.acts button.on svg{fill:currentColor}
.cmts{padding:0 16px 10px}
.cmt{padding:4px 0;font-size:15px}.cmt b{margin-right:6px}
.cin{display:flex;gap:8px;margin-top:6px}
.cin input{flex:1}

input,select,textarea{width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--card)}
textarea{resize:none;min-height:88px}

/* chat */
.thread{display:flex;gap:12px;align-items:center;width:100%;padding:12px 16px;border-bottom:1px solid var(--line)}
.thread .tx{flex:1;min-width:0}.thread b{display:block}
.thread span.l{display:block;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
.screen{position:absolute;inset:0;background:var(--paper);display:flex;flex-direction:column;z-index:20}
.screen header{display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 10px) 10px 10px;border-bottom:1px solid var(--line)}
.msgs{flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.bub{max-width:78%;padding:9px 13px;border-radius:18px 18px 18px 5px;background:var(--card);border:1px solid var(--line)}
.bub.me{align-self:flex-end;background:var(--acc);color:var(--acc-ink);border:0;border-radius:18px 18px 5px 18px}
.compose{display:flex;gap:8px;padding:10px 12px calc(env(safe-area-inset-bottom) + 10px);border-top:1px solid var(--line)}
.send{width:46px;height:46px;border-radius:50%;background:var(--acc);color:var(--acc-ink);display:grid;place-items:center;flex:none}

/* marketplace */
.msearch{padding:12px 16px 4px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:8px 16px;scrollbar-width:none}
.chip{flex:none;padding:7px 14px;border-radius:999px;border:1.5px solid var(--line);font-weight:600;font-size:14px;background:var(--card)}
.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 12px;padding:8px 16px}
.lc{display:block;width:100%;position:relative}
.lm{position:relative;aspect-ratio:1/1.08;border-radius:6px 22px 6px 22px;overflow:hidden}
.lm .ph,.lm img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tag{position:absolute;inset-inline-start:8px;bottom:8px;padding:3px 9px;border-radius:999px;background:var(--card);font-size:12px;font-weight:600}
.sv{position:absolute;inset-inline-end:6px;top:6px;width:34px;height:34px;border-radius:50%;background:var(--card);display:grid;place-items:center}
.sv.on{color:var(--coral)}.sv.on svg{fill:currentColor}
.lt{margin-top:7px;font-weight:600;line-height:1.25}
.lp{font:800 17px var(--disp)}
.ls{font-size:13px;color:var(--mute)}
.empty{grid-column:1/-1;text-align:center;padding:40px 10px;color:var(--mute)}

/* sheets */
#sheet{position:absolute;inset:0;z-index:30;display:none}
#sheet.open{display:block}
.bd{position:absolute;inset:0;background:rgba(10,20,20,.5)}
.panel{position:absolute;left:0;right:0;bottom:0;max-height:92%;overflow-y:auto;background:var(--paper);border-radius:26px 26px 0 0;padding:18px 18px calc(env(safe-area-inset-bottom) + 20px);animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.panel h2{font:800 24px/1.1 var(--disp);letter-spacing:-.02em;margin-bottom:12px}
.fld{margin-bottom:12px}.fld label{display:block;font-weight:600;font-size:14px;margin-bottom:5px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button{padding:10px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);font-weight:600;text-align:center}
.seg button.on{border-color:var(--ink);background:var(--soft)}
.btn{display:block;width:100%;padding:14px;border-radius:14px;background:var(--acc);color:var(--acc-ink);font-weight:700;text-align:center}
.btn.alt{background:var(--card);color:var(--ink);border:1.5px solid var(--line)}
.row2{display:grid;grid-template-columns:1fr 1.4fr;gap:10px;margin-top:12px}
.dm{aspect-ratio:4/3;border-radius:6px 26px 6px 26px;overflow:hidden;margin-bottom:12px;position:relative}
.dm .ph,.dm img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.big{font:800 28px var(--disp);letter-spacing:-.02em}
.note{background:var(--soft);padding:10px 12px;border-radius:12px;margin:10px 0;font-size:15px}
.sel{display:flex;gap:10px;align-items:center;margin:10px 0}
.up{display:flex;gap:10px;align-items:center;padding:12px;border:1.5px dashed var(--mute);border-radius:12px;font-weight:600;cursor:pointer}
.up img,.up video{width:56px;height:56px;border-radius:10px;object-fit:cover}

.item{display:flex;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);align-items:flex-start}
.item p{flex:1}.item small{color:var(--mute);display:block}
.stats{display:flex;gap:26px;padding:6px 16px 16px}
.stats b{display:block;font:800 22px var(--disp)}
.stats span{color:var(--mute);font-size:14px}
.prof{padding:22px 16px 8px;display:flex;gap:14px;align-items:center}
.prof .av{width:72px;height:72px;font-size:28px}
h3.sub{font:800 18px var(--disp);padding:8px 16px}

#toast{position:absolute;left:50%;bottom:92px;transform:translate(-50%,20px);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:999px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:50;white-space:nowrap}
#toast.show{opacity:1;transform:translate(-50%,0)}

.hr{display:flex;align-items:center;gap:4px}
.setbody{flex:1;overflow-y:auto;padding-bottom:30px}
.srow{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:14px 16px;border-bottom:1px solid var(--line)}
.srow.col{flex-direction:column;align-items:stretch;gap:10px}
.lbl{font-weight:600}
.seg.c3{grid-template-columns:repeat(3,1fr)}
.seg.c3 button{background:var(--card);color:var(--ink)}
.switch{width:54px;height:32px;border-radius:999px;background:var(--line);position:relative;flex:none;transition:background .2s;border:1.5px solid var(--mute)}
.switch i{position:absolute;top:3px;inset-inline-start:3px;width:22px;height:22px;border-radius:50%;background:var(--ink);transition:transform .2s}
.switch.on{background:var(--acc);border-color:var(--acc)}
.switch.on i{transform:translateX(22px);background:var(--acc-ink)}
[dir=rtl] .switch.on i{transform:translateX(-22px)}
.dots{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.dotb{width:38px;height:38px;border-radius:50%;border:3px solid var(--paper);box-shadow:0 0 0 2px var(--line)}
.dotb.on{box-shadow:0 0 0 3px var(--ink)}
.btn.sm{width:auto;padding:10px 16px;flex:none}
.saverph{display:grid;place-items:center;text-align:center;font-weight:600;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.6);width:100%;line-height:1.3}
.screen header .ttl{font:800 22px var(--disp)}
[dir=rtl] .flip svg{transform:scaleX(-1)}
body.saver *{animation:none!important;transition:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
.ptext{white-space:pre-wrap;overflow-wrap:anywhere}
img.av{object-fit:cover;display:block;background:var(--line)}
.up span#prev{display:grid;place-items:center;width:56px;height:56px;border-radius:10px;background:var(--soft);flex:none}
.pmedia{object-fit:cover}
@media (min-width:600px){#app{max-width:640px;box-shadow:0 0 0 1px var(--line)}}
.grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
.panel{max-width:520px;margin:0 auto}
#main.vmode{position:relative;overflow:hidden;padding:0;background:#000}
.vidfeed{position:absolute;inset:0;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none;overscroll-behavior:contain;outline:none}
.vidfeed::-webkit-scrollbar{display:none}
#main.vmode .empty{color:#fff}
.vid{position:relative;height:100%;scroll-snap-align:start;scroll-snap-stop:always;background:#000;color:#fff;overflow:hidden}
.vid video{width:100%;height:100%;object-fit:contain;display:block;background:#000;cursor:pointer}
.vshade{position:absolute;left:0;right:0;bottom:0;height:45%;background:linear-gradient(transparent,rgba(0,0,0,.72));pointer-events:none}
.vinfo{position:absolute;left:14px;right:84px;bottom:18px;text-shadow:0 1px 4px rgba(0,0,0,.7);pointer-events:none}
.vinfo b{font-size:17px}
.vinfo p{margin-top:4px;font-size:15px;max-height:4.5em;overflow:hidden;white-space:pre-wrap;overflow-wrap:anywhere}
.vacts{position:absolute;right:8px;bottom:22px;display:flex;flex-direction:column;gap:14px;align-items:center}
.va{display:flex;flex-direction:column;align-items:center;gap:3px;color:#fff;font-weight:700;font-size:13px;text-shadow:0 1px 3px rgba(0,0,0,.7)}
.va .c{width:50px;height:50px;border-radius:50%;background:rgba(0,0,0,.42);display:grid;place-items:center}
.va svg{width:26px;height:26px}
.va.on .c{color:#ff6b4a}.va.on svg{fill:currentColor}
.va .av{border:2px solid #fff}
.vmute{position:absolute;top:10px;right:10px;width:44px;height:44px;border-radius:50%;background:rgba(0,0,0,.45);color:#fff;display:grid;place-items:center}
.vplay{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:#fff;font-weight:700;background:rgba(0,0,0,.4);line-height:1.4}
.vgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;padding:3px 16px}
.vgrid button{position:relative;aspect-ratio:9/12;background:#111;overflow:hidden;border-radius:6px}
.vgrid video{width:100%;height:100%;object-fit:cover;pointer-events:none}
.vgrid span{position:absolute;left:6px;bottom:4px;color:#fff;font-size:12px;font-weight:700;text-shadow:0 1px 3px #000}
@media (min-width:900px){
  #app{max-width:1120px;display:grid;grid-template-columns:230px 1fr;grid-template-rows:auto 1fr}
  #nav{grid-column:1;grid-row:1 / span 2;flex-direction:column;justify-content:flex-start;gap:4px;border-top:0;border-right:1px solid var(--line);padding:22px 12px}
  #nav button{flex-direction:row;justify-content:flex-start;gap:14px;font-size:16px;padding:6px 8px;border-radius:14px}
  #nav .pill{width:46px;height:38px}
  #head{grid-column:2;grid-row:1}
  #main{grid-column:2;grid-row:2;min-height:0}
  #main:not(.vmode)>*{max-width:780px;margin-left:auto;margin-right:auto}
  .vidfeed{left:50%;right:auto;width:min(480px,100%);transform:translateX(-50%)}
  .screen{left:230px}
  #toast{bottom:28px}
}
button.ph-row{width:auto}
.prow{display:flex;align-items:center;gap:4px;padding-inline-end:6px}
.prow .ph-row{flex:1;min-width:0}
.pbadge{font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--soft);white-space:nowrap}
.acts .sp{margin-inline-start:auto}
.pcenter{text-align:center;padding:18px 16px 6px}
.pcenter .av{margin:0 auto}
.optrow{display:flex;align-items:center;justify-content:space-between;width:100%;padding:14px 4px;border-bottom:1px solid var(--line);font-weight:600}
.optrow.red{color:var(--coral)}
.reqrow{display:flex;gap:10px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.reqrow .tx{flex:1;min-width:0}
.btn.sm2{width:auto;padding:8px 14px;flex:none}
#auth{position:absolute;inset:0;z-index:40;background:var(--paper);display:none;flex-direction:column;justify-content:center;padding:24px;overflow-y:auto}
.err{color:var(--coral);font-weight:600;min-height:24px;margin:2px 0 10px}
.err.okmsg{color:var(--acc)}
.btn:disabled{opacity:.6}
</style>
</head>

/* ---------- data ---------- */
async function loadProfiles(ids) {
  ids = [...new Set(ids)].filter(i => i && !S.pf[i]);
  if (!ids.length) return;
  const { data } = await sb.from('profiles').select('id,display_name,username,country,bio,avatar_url').in('id', ids);
  (data || []).forEach(p => S.pf[p.id] = p);
}
const POSTCOLS = 'id,user_id,content,created_at,media_url,media_type,visibility,pinned_at';
async function hydratePosts(posts) {
  const ids = posts.map(p => p.id);
  let likes = [], cms = [];
  if (ids.length) {
    const [l, c] = await Promise.all([
      sb.from('post_likes').select('post_id,user_id').in('post_id', ids),
      sb.from('comments').select('id,post_id,user_id,content,created_at').in('post_id', ids).order('created_at', { ascending: true })
    ]);
    likes = l.data || []; cms = c.data || [];
  }
  await loadProfiles([...posts.map(p => p.user_id), ...cms.map(c => c.user_id)]);
  return posts.map(p => ({
    id: p.id, uid: p.user_id, t: ago(p.created_at), text: p.content,
    media: safeUrl(p.media_url) ? { type: p.media_type === 'video' ? 'video' : 'image', url: p.media_url } : null,
    vis: p.visibility || 'public', pin: !!p.pinned_at,
    likes: likes.filter(l => l.post_id === p.id).length,
    liked: likes.some(l => l.post_id === p.id && l.user_id === S.user.id),
    cm: cms.filter(c => c.post_id === p.id).map(c => ({ w: nameOf(c.user_id), t: c.content }))
  }));
}
async function loadFeed() {
  const { data, error } = await sb.from('posts').select(POSTCOLS).order('created_at', { ascending: false }).limit(40);
  if (error) throw error;
  S.posts = await hydratePosts(data); S.ready.home = 1;
}
async function loadSavedIds() {
  const { data } = await sb.from('saved_posts').select('post_id').eq('user_id', S.user.id);
  S.savedPosts = new Set((data || []).map(x => x.post_id));
}
async function loadProducts() {
  const { data, error } = await sb.from('products').select('*').eq('status', 'active').order('created_at', { ascending: false }).limit(60);
  if (error) throw error;
  const sv = await sb.from('saved_items').select('product_id').eq('user_id', S.user.id);
  await loadProfiles(data.map(p => p.seller_id));
  S.products = data.map(p => ({
    id: p.id, title: p.title, price: p.price, cur: p.currency, opt: p.price_type, cat: p.category,
    sid: p.seller_id, who: nameOf(p.seller_id), desc: p.description || '', h: hue(p.id + p.title),
    media: safeUrl(p.image_url) ? { type: 'image', url: p.image_url } : null
  }));
  S.saved = new Set((sv.data || []).map(x => x.product_id));
  S.ready.market = 1;
}
async function loadThreads() {
  const me = S.user.id;
  const { data, error } = await sb.from('messages').select('id,sender_id,receiver_id,body,created_at').or(`sender_id.eq.${me},receiver_id.eq.${me}`).order('created_at', { ascending: true }).limit(500);
  if (error) throw error;
  const map = new Map();
  data.forEach(m => {
    const other = m.sender_id === me ? m.receiver_id : m.sender_id;
    if (!map.has(other)) map.set(other, { id: other, msgs: [], last: 0 });
    const t = map.get(other); t.msgs.push({ me: m.sender_id === me, t: m.body }); t.last = new Date(m.created_at).getTime();
  });
  await loadProfiles([...map.keys()]);
  S.threads = [...map.values()].sort((a, b) => b.last - a.last);
  S.ready.chat = 1;
}
async function loadAlerts() {
  const me = S.user.id;
  const rq = await sb.from('friendships').select('requester_id').eq('addressee_id', me).eq('status', 'pending').order('created_at', { ascending: false }).limit(30);
  S.reqs = (rq.data || []).map(x => x.requester_id); await loadProfiles(S.reqs);
  const { data: mine } = await sb.from('posts').select('id').eq('user_id', me).limit(100);
  const ids = (mine || []).map(p => p.id);
  let items = [];
  if (ids.length) {
    const [l, c] = await Promise.all([
      sb.from('post_likes').select('post_id,user_id,created_at').in('post_id', ids).neq('user_id', me).order('created_at', { ascending: false }).limit(30),
      sb.from('comments').select('post_id,user_id,content,created_at').in('post_id', ids).neq('user_id', me).order('created_at', { ascending: false }).limit(30)
    ]);
    const L = l.data || [], C = c.data || [];
    await loadProfiles([...L.map(x => x.user_id), ...C.map(x => x.user_id)]);
    items = [
      ...L.map(x => ({ uid: x.user_id, text: nameOf(x.user_id) + ' liked your post', at: x.created_at })),
      ...C.map(x => ({ uid: x.user_id, text: nameOf(x.user_id) + ' commented: ' + x.content.slice(0, 80), at: x.created_at }))
    ];
  }
  items.sort((a, b) => new Date(b.at) - new Date(a.at));
  S.notes = items.slice(0, 30); S.ready.alerts = 1;
}
async function loadMe() {
  const me = S.user.id;
  const [a, b, c, d, vs] = await Promise.all([
    sb.from('posts').select('id', { count: 'exact', head: true }).eq('user_id', me),
    sb.from('follows').select('following_id', { count: 'exact', head: true }).eq('follower_id', me),
    sb.from('follows').select('follower_id', { count: 'exact', head: true }).eq('following_id', me),
    sb.from('videos').select('id', { count: 'exact', head: true }).eq('user_id', me),
    sb.from('videos').select('id,video_url,views').eq('user_id', me).order('created_at', { ascending: false }).limit(30)
  ]);
  S.me = { posts: a.count || 0, following: b.count || 0, followers: c.count || 0, videos: d.count || 0 };
  S.myVideos = (vs.data || []).filter(v => safeUrl(v.video_url));
  const pin = await sb.from('posts').select(POSTCOLS).eq('user_id', me).not('pinned_at', 'is', null).order('pinned_at', { ascending: false });
  const rec = await sb.from('posts').select(POSTCOLS).eq('user_id', me).is('pinned_at', null).order('created_at', { ascending: false }).limit(20);
  S.myPosts = await hydratePosts([...(pin.data || []), ...(rec.data || [])]);
  await loadProducts(); S.ready.me = 1;
}
async function loadVideos() {
  const cols = 'id,user_id,video_url,caption,views,created_at';
  const { data: vs, error } = await sb.from('videos').select(cols).order('created_at', { ascending: false }).limit(30);
  if (error) throw error;
  let list = vs;
  if (S.focusVideo && !list.some(v => v.id === S.focusVideo)) {
    const { data: one } = await sb.from('videos').select(cols).eq('id', S.focusVideo).maybeSingle();
    if (one) list = [one, ...list];
  }
  const ids = list.map(v => v.id); let likes = [], cms = [];
  if (ids.length) {
    const [l, c] = await Promise.all([
      sb.from('video_likes').select('video_id,user_id').in('video_id', ids),
      sb.from('video_comments').select('video_id').in('video_id', ids)
    ]);
    likes = l.data || []; cms = c.data || [];
  }
  await loadProfiles(list.map(v => v.user_id));
  S.videos = list.filter(v => safeUrl(v.video_url)).map(v => ({
    id: v.id, uid: v.user_id, url: v.video_url, cap: v.caption, views: Number(v.views) || 0,
    likes: likes.filter(x => x.video_id === v.id).length,
    liked: likes.some(x => x.video_id === v.id && x.user_id === S.user.id),
    cc: cms.filter(x => x.video_id === v.id).length
  }));
  S.ready.video = 1;
}
async function refresh() {
  const t = S.tab;
  try {
    if (t === 'home') await loadFeed();
    else if (t === 'market') await loadProducts();
    else if (t === 'chat') await loadThreads();
    else if (t === 'alerts') await loadAlerts();
    else if (t === 'video') await loadVideos();
    else if (t === 'me') await loadMe();
  } catch (e) { S.ready[t] = 'err'; toast('Could not load. Check your internet.'); }
  if (S.tab === t && !$('#over').innerHTML) render(true);
}

function showAuth(msg, ok) {
  const m = S.authMode, up = m === 'signup';
  $('#auth').innerHTML = `<div class="mark" style="font-size:46px">KiHelp</div>
    <p class="ls" style="margin:6px 0 20px">Connect, share and trade. All in one app.</p>
    <div class="seg" style="margin-bottom:14px"><button class="${!up ? 'on' : ''}" data-a="amode" data-id="login">Log in</button><button class="${up ? 'on' : ''}" data-a="amode" data-id="signup">Sign up</button></div>
    <form id="af" novalidate>
      ${up ? `<div class="fld"><label for="an">Your name</label><input id="an" autocomplete="name" maxlength="50" placeholder="e.g. Abeneazer"></div>
      <div class="fld"><label for="ac">Country (optional)</label><input id="ac" maxlength="50" placeholder="e.g. Ethiopia"></div>` : ''}
      <div class="fld"><label for="ae">Email</label><input id="ae" type="email" autocomplete="email" inputmode="email" placeholder="you@example.com"></div>
      <div class="fld"><label for="ap">Password</label><input id="ap" type="password" autocomplete="${up ? 'new-password' : 'current-password'}" placeholder="At least 8 characters"></div>
      <div class="err ${ok ? 'okmsg' : ''}" id="aerr" role="alert">${esc(msg || '')}</div>
      <button class="btn" id="abtn" type="submit">${up ? 'Create account' : 'Log in'}</button>
    </form>`;
  $('#auth').style.display = 'flex';
}
const hideAuth = () => { $('#auth').style.display = 'none'; $('#auth').innerHTML = ''; };
async function doAuth() {
  if (!sb) return showAuth('Could not load the sign-in service. Check your internet.');
  const email = $('#ae').value.trim(), password = $('#ap').value, up = S.authMode === 'signup';
  const err = m => { $('#aerr').className = 'err'; $('#aerr').textContent = m; };
  if (!/^\S+@\S+\.\S+$/.test(email)) return err('Enter a valid email.');
  if (password.length < 8) return err('Password must be at least 8 characters.');
  const btn = $('#abtn'); btn.disabled = true; btn.textContent = '...';
  try {
    if (up) {
      const display_name = ($('#an').value.trim() || email.split('@')[0]).slice(0, 50), country = $('#ac').value.trim().slice(0, 50) || null;
      const { data, error } = await sb.auth.signUp({ email, password, options: { data: { display_name, country } } });
      if (error) throw error;
      if (data.session) return enter(data.user);
      S.authMode = 'login'; return showAuth('Account created. Check your email to confirm it, then log in.', true);
    }
    const { data, error } = await sb.auth.signInWithPassword({ email, password });
    if (error) throw error;
    await enter(data.user);
  } catch (e) {
    btn.disabled = false; btn.textContent = up ? 'Create account' : 'Log in';
    err(/confirm/i.test(e.message) ? 'Please confirm your email first, then log in.' : (e.message || 'Something went wrong.'));
  }
}
async function ensureProfile(user) {
  const { data } = await sb.from('profiles').select('*').eq('id', user.id).maybeSingle();
  if (data) { S.profile = data; S.pf[user.id] = data; return; }
  const md = user.user_metadata || {};
  const row = { id: user.id, display_name: (md.display_name || (user.email || 'member').split('@')[0]).slice(0, 50), country: md.country || null };
  const { data: ins } = await sb.from('profiles').insert(row).select().single();
  S.profile = ins || row; S.pf[user.id] = S.profile;
}
async function enter(user) {
  S.user = user; S.ready = {};
  try { await ensureProfile(user); } catch (e) { S.profile = { id: user.id, display_name: (user.email || 'Member').split('@')[0] }; S.pf[user.id] = S.profile; }
  loadPrivate().catch(() => {});
  loadSavedIds().catch(() => {});
  hideAuth(); S.tab = S.focusVideo ? 'video' : 'home'; render(); refresh();
}
function resetSession() {
  clearInterval(S.poll); S.openThread = null;

}

const MAXV = 50 * 1024 * 1024;
async function compressImage(file) {
  if (file.type === 'image/gif') return file;
  const maxW = S.saver ? 960 : 1280, q = S.saver ? 0.7 : 0.8;
  let bmp = null; try { bmp = await createImageBitmap(file); } catch (e) {}
  if (!bmp) return file;
  const r = Math.min(1, maxW / Math.max(bmp.width, bmp.height));
  const c = document.createElement('canvas'); c.width = Math.round(bmp.width * r); c.height = Math.round(bmp.height * r);
  c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
  return await new Promise(res => c.toBlob(b => res(b || file), 'image/jpeg', q));
}
async function uploadMedia(file) {
  const isVid = file.type.startsWith('video');
  let blob = file, ext;
  if (isVid) {
    if (file.size > MAXV) throw new Error('Video is too big. The limit is 50 MB.');
    ext = file.type.includes('webm') ? 'webm' : file.type.includes('quicktime') ? 'mov' : 'mp4';
  } else { blob = await compressImage(file); ext = blob.type === 'image/gif' ? 'gif' : 'jpg'; }
  const path = `${S.user.id}/${Date.now()}-${Math.random().toString(36).slice(2, 8)}.${ext}`;
  const { error } = await sb.storage.from('media').upload(path, blob, { contentType: blob.type || file.type, cacheControl: '31536000' });
  if (error) throw error;
  return { url: sb.storage.from('media').getPublicUrl(path).data.publicUrl, type: isVid ? 'video' : 'image' };
}
const upErr = e => /mime|type/i.test(e.message || '') ? 'This file type is not supported. Use JPG, PNG or MP4.' : (e.message || 'Upload failed');
const uploadField = (accept, label) => `<label class="up"><input type="file" id="file" accept="${accept}" hidden><span id="prev">${I.plus}</span>${label}</label>`;
function bindUpload() {
  const f = $('#file'); if (!f) return;
  f.onchange = () => {
    const file = f.files[0]; if (!file) return;
    if (S.draft && S.draft.prev) URL.revokeObjectURL(S.draft.prev);
    const type = file.type.startsWith('video') ? 'video' : 'image', prev = URL.createObjectURL(file);
    S.draft = { file, type, prev };

  };
}

async function loadProfileData(id, reset) {

        sb.from('blocks').select('blocked_id', { count: 'exact', head: true }).eq('blocker_id', me).eq('blocked_id', id),
        sb.from('follows').select('follower_id', { count: 'exact', head: true }).eq('following_id', id),

async function friendAdd(id) {

  },
  savephone: async () => {
    const raw = $('#phone').value.replace(/[\s\-()]/g, '');
    if (raw && !/^\+[0-9]{7,15}$/.test(raw)) return toast('Use the format +251912345678');
    if (await savePrivate({ phone: raw || null, allow_phone_search: raw ? S.pc.allow_phone_search : false })) { toast('Saved'); openSettings(); }
  },

  like: async id => {
    const p = findPost(id), was = p.liked;
    p.liked = !was; p.likes += was ? -1 : 1; repaint();
    const q = was ? sb.from('post_likes').delete().eq('post_id', p.id).eq('user_id', S.user.id) : sb.from('post_likes').insert({ post_id: p.id, user_id: S.user.id });
    const { error } = await q;
    if (error) { p.liked = was; p.likes += was ? 1 : -1; repaint(); toast('Could not update like'); }
  },
  cmt: id => { id = +id; S.open.has(id) ? S.open.delete(id) : S.open.add(id); repaint(); },
  addcmt: async id => {
    const el = $('#ci' + id), v = el.value.trim(); if (!v) return;
    const { error } = await sb.from('comments').insert({ post_id: +id, user_id: S.user.id, content: v });
    if (error) return toast('Could not comment');
    const p = findPost(id); if (p) p.cm.push({ w: nameOf(S.user.id), t: v });
    S.open.add(+id); repaint();
  },
  share: () => { try { navigator.clipboard.writeText(location.href); } catch (e) {} toast('Link copied'); },
  thread: id => openThread(id),
  back: () => { clearInterval(S.poll); S.openThread = null; S.prof = null; $('#over').innerHTML = ''; render(true); if (S.tab === 'chat') refresh(); },
  send: id => sendMsg(id),
  cat: id => { S.cat = id; $('#cats').innerHTML = catChips(); $('#grid').innerHTML = gridHTML(); },
  opt: id => { S.opt = id; $('#opts').innerHTML = optChips(); $('#grid').innerHTML = gridHTML(); },
  save: async id => {
    id = +id; const was = S.saved.has(id);
    was ? S.saved.delete(id) : S.saved.add(id);
    S.tab === 'market' ? $('#grid').innerHTML = gridHTML() : render(true);
    const q = was ? sb.from('saved_items').delete().eq('user_id', S.user.id).eq('product_id', id) : sb.from('saved_items').insert({ user_id: S.user.id, product_id: id });
    const { error } = await q;
    if (error) { was ? S.saved.add(id) : S.saved.delete(id); S.tab === 'market' ? $('#grid').innerHTML = gridHTML() : render(true); toast('Could not save'); }
    else toast(was ? 'Removed from saved' : 'Saved');
  },
  close: closeSheet,

  listing: id => {
    const l = S.products.find(x => x.id == id); if (!l) return;
    const mine = l.sid === S.user.id;
    const price = `<div class="big">${fmt(l.price, l.cur)}${l.opt === 'bulk' ? ' / unit' : ''}</div>`;
    const info = { fixed: 'The seller set one price.', negotiable: 'Price can be discussed. Send an offer in chat.', auction: 'Bidding opens soon. For now, message the seller.', bulk: 'Ask the seller about discounts for larger orders.' }[l.opt] || '';
    const primary = mine ? ['sold', 'Mark as sold'] : { fixed: ['order', 'Order now'], bulk: ['order', 'Order now'], negotiable: ['offer', 'Make an offer'], auction: ['bid', 'Place bid'] }[l.opt] || ['order', 'Order now'];
    sheet(`<div class="dm">${l.media ? media(l.media, '') : `<div class="ph" style="--h:${l.h}"></div>`}</div>
      <h2>${esc(l.title)}</h2>${price}
      <div class="note"><b>${OPT[l.opt] || esc(l.opt)}.</b> ${info}</div>
      <p style="white-space:pre-wrap">${esc(l.desc)}</p>
      <div class="sel">${avOf(l.sid, 36)}<div><b>${esc(l.who)}</b><div class="ls">${esc(l.cat)}</div></div></div>
      <button class="btn" data-a="${primary[0]}" data-id="${l.id}">${primary[1]}</button>
      ${mine ? '' : `<div class="row2"><button class="btn alt" data-a="save" data-id="${l.id}">${S.saved.has(l.id) ? 'Saved' : 'Save'}</button>
      <button class="btn alt" data-a="msgseller" data-id="${l.id}">Message seller</button></div>`}`);
  },
  msgseller: id => { const l = S.products.find(x => x.id == id); closeSheet(); openThread(l.sid, `Hi, is "${l.title}" still available?`); },
  offer: id => { const l = S.products.find(x => x.id == id); closeSheet(); openThread(l.sid, `Hi, would you take ___ ${l.cur === 'ETB' ? 'Birr' : l.cur} for "${l.title}"?`); },
  order: () => { closeSheet(); toast('Orders and payments come in the next step'); },
  bid: () => toast('Bidding opens soon. Message the seller for now.'),
  sold: async id => {
    const { error } = await sb.from('products').update({ status: 'sold' }).eq('id', +id).eq('seller_id', S.user.id);
    if (error) return toast('Could not update');
    closeSheet(); try { await loadProducts(); } catch (e) {} render(true); toast('Marked as sold');
  },

  sell: () => {
    S.sellOpt = 'fixed';
    sheet(`<h2>Sell an item</h2>
      <div class="fld">${uploadField('image/*', 'Add a photo')}</div>
      <div class="fld"><label for="st">What are you selling?</label><input id="st" maxlength="120" placeholder="e.g. Wooden chair"></div>
      <div class="fld"><label>How do you want to price it?</label><div class="seg" id="so">${Object.entries(OPT).map(([k, v]) => `<button data-a="sopt" data-id="${k}" class="${k === 'fixed' ? 'on' : ''}">${v}</button>`).join('')}</div></div>
      <div class="fld"><label for="sp">Price</label><div style="display:grid;grid-template-columns:1.4fr 1fr;gap:8px"><input id="sp" type="number" inputmode="decimal" min="0" placeholder="0"><select id="scur" aria-label="Currency">${CURS.map(c => `<option>${c}</option>`).join('')}</select></div></div>
      <div class="fld"><label for="sc">Category</label><select id="sc">${CATS.slice(1).map(c => `<option>${c}</option>`).join('')}</select></div>
      <div class="fld"><label for="sd">Description</label><textarea id="sd" maxlength="1000" placeholder="Condition, size, pickup or delivery"></textarea></div>
      <button class="btn" id="pubbtn" data-a="publish">Publish item</button>`);
    bindUpload();
  },
  sopt: id => { S.sellOpt = id; document.querySelectorAll('#so button').forEach(b => b.classList.toggle('on', b.dataset.id === id)); },
  publish: async () => {
    const title = $('#st').value.trim(), price = parseFloat($('#sp').value);
    if (!title) return toast('Add a title');
    if (!(price >= 0)) return toast('Add a price');
    busy('#pubbtn', true, S.draft ? 'Uploading...' : '...');
    let m = null;
    try { if (S.draft) m = await uploadMedia(S.draft.file); } catch (e) { busy('#pubbtn', false, 'Publish item'); return toast(upErr(e)); }
    const { error } = await sb.from('products').insert({ seller_id: S.user.id, title, description: $('#sd').value.trim(), price, category: $('#sc').value, price_type: S.sellOpt, currency: $('#scur').value, image_url: m ? m.url : null });
    if (error) { busy('#pubbtn', false, 'Publish item'); return toast('Could not publish'); }
    closeSheet(); S.cat = 'All'; S.opt = 'all'; S.q = '';
    try { await loadProducts(); } catch (e) {}
    render(); toast('Published');
  },

  newpost: () => {
    S.postVis = 'public';
    sheet(`<h2>New post</h2>
      <div class="fld"><textarea id="pt" maxlength="3000" placeholder="What's on your mind?"></textarea></div>
      <div class="fld">${uploadField('image/*,video/mp4,video/webm,video/quicktime', 'Add a photo or video')}</div>
      <div class="fld"><label>Who can see this post?</label><div class="seg c3" id="pvs">${[['public', 'Public'], ['friends', 'Friends'], ['private', 'Only me']].map(([k, l]) => `<button data-a="pvsel" data-id="${k}" class="${k === 'public' ? 'on' : ''}">${l}</button>`).join('')}</div></div>
      <button class="btn" id="postbtn" data-a="publishpost">${tr('post')}</button>`);
    bindUpload();
  },
  publishpost: async () => {
    const text = $('#pt').value.trim();
    if (!text && !S.draft) return toast('Write something or add a photo');
    busy('#postbtn', true, S.draft ? 'Uploading...' : '...');
    let m = null;
    try { if (S.draft) m = await uploadMedia(S.draft.file); } catch (e) { busy('#postbtn', false, tr('post')); return toast(upErr(e)); }
    const { error } = await sb.from('posts').insert({ user_id: S.user.id, content: text, media_url: m ? m.url : null, media_type: m ? m.type : null, visibility: S.postVis });
    if (error) { busy('#postbtn', false, tr('post')); return toast('Could not post'); }
    closeSheet(); try { await loadFeed(); } catch (e) {} render(); toast('Posted');
  },

  editprofile: () => {
    const p = S.profile || {};
    sheet(`<h2>Edit profile</h2>
      <div class="fld">${uploadField('image/*', 'Change profile photo')}</div>
      <div class="fld"><label for="pn">Name</label><input id="pn" maxlength="50" value="${esc(p.display_name || '')}"></div>
      <div class="fld"><label for="pu">Username</label><div style="display:flex;align-items:center;gap:6px"><span class="lbl">@</span><input id="pu" maxlength="20" autocapitalize="none" autocomplete="off" value="${esc(p.username || '')}" placeholder="yourname"></div><div class="ls" style="margin-top:4px">3 to 20 letters, numbers or underscores</div></div>
      <div class="fld"><label for="pc">Country</label><input id="pc" maxlength="50" value="${esc(p.country || '')}"></div>
      <div class="fld"><label for="pb">About you</label><textarea id="pb" maxlength="300">${esc(p.bio || '')}</textarea></div>
      <button class="btn" id="profbtn" data-a="saveprofile">Save</button>`);
    bindUpload();
  },
  saveprofile: async () => {
    const uname = $('#pu').value.trim().toLowerCase().replace(/^@/, '');
    if (uname && !/^[a-z0-9_]{3,20}$/.test(uname)) return toast('Username: 3 to 20 letters, numbers or _');
    const row = { username: uname || null, display_name: $('#pn').value.trim().slice(0, 50) || 'Member', country: $('#pc').value.trim().slice(0, 50) || null, bio: $('#pb').value.trim().slice(0, 300) || null };
    busy('#profbtn', true, S.draft ? 'Uploading...' : '...');
    try { if (S.draft) row.avatar_url = (await uploadMedia(S.draft.file)).url; } catch (e) { busy('#profbtn', false, 'Save'); return toast(upErr(e)); }
    const { error } = await sb.from('profiles').update(row).eq('id', S.user.id);
    if (error) { busy('#profbtn', false, 'Save'); return toast(error.code === '23505' ? 'That username is taken' : error.code === '23514' ? 'That username is not allowed' : 'Could not save'); }
    S.profile = { ...S.profile, ...row }; S.pf[S.user.id] = S.profile;
    closeSheet(); render(true); toast('Saved');
  }
};

document.addEventListener('click', e => {
  const a = e.target.closest('[data-a]'); if (!a) return;
  if (a.classList.contains('bd') && e.target !== a) return;
  const f = ACT[a.dataset.a]; if (f) f(a.dataset.id, a);
});
document.addEventListener('submit', e => { if (e.target.id === 'af') { e.preventDefault(); doAuth(); } });
let searchTimer;
document.addEventListener('input', e => { if (e.target.id === 'ps') { clearTimeout(searchTimer); const v = e.target.value; searchTimer = setTimeout(() => runSearch(v), 350); }
  if (e.target.id === 'q') { S.q = e.target.value; $('#grid').innerHTML = gridHTML(); } });
document.addEventListener('change', e => { if (e.target.id === 'lang') { S.lang = e.target.value; saveSettings(); applyTheme(); render(true); openSettings(); } });
if (window.matchMedia) { const mq = matchMedia('(prefers-color-scheme: dark)'); if (mq.addEventListener) mq.addEventListener('change', () => { if (S.mode === 'system') applyTheme(); }); }
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.id === 'mi') { const b = document.querySelector('[data-a="send"]'); if (b) b.click(); }
  if (e.key === 'Enter' && e.target.matches && e.target.matches('.lm')) e.target.click();
  if (e.key === 'Escape') closeSheet();
  if ((e.key === 'ArrowDown' || e.key === 'ArrowUp') && S.tab === 'video' && $('#vf') && !$('#over').innerHTML && !$('#sheet').classList.contains('open') && !/INPUT|TEXTAREA|SELECT/.test((e.target.tagName || ''))) {
    e.preventDefault(); $('#vf').scrollBy({ top: (e.key === 'ArrowDown' ? 1 : -1) * $('#vf').clientHeight, behavior: 'smooth' });
  }
});

async function boot() {
  const hm = location.hash.match(/^#v=([0-9a-f-]{36})$/i); if (hm) S.focusVideo = hm[1];
  applyTheme(); render();
  if (!sb) return showAuth('Could not load the sign-in service. Check your internet and refresh.');
  sb.auth.onAuthStateChange(ev => { if (ev === 'SIGNED_OUT' && S.user) resetSession(); });
  const { data } = await sb.auth.getSession();
  if (data && data.session) enter(data.session.user); else showAuth();
}
boot();

</script>
</body>
</html>
