<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>KiHelp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=12">
<script>
window.addEventListener('error', function (e) {
  var a = document.getElementById('app');
  if (a && !a.getAttribute('data-err')) {
    a.setAttribute('data-err', '1');
    a.insertAdjacentHTML('afterbegin', '<div style="padding:24px;font:16px/1.5 system-ui,sans-serif;color:#b00020;background:#fff">KiHelp could not start.<br><br>' + String(e.message || 'Unknown error') + '<br><br>Check that index.html, style.css and app.js are all uploaded, then refresh.</div>');
  }
});
</script>
</head>
<body>
<div id="app">
  <div id="head"></div>
  <div id="main"></div>
  <nav id="nav" aria-label="Main"></nav>
  <div id="over"></div>
  <div id="sheet"></div>
  <div id="auth"></div>
  <div id="viewer"></div>
  <div id="story"></div>
  <div id="toast" role="status"></div>
</div>
<noscript><p style="padding:24px;font-family:system-ui">KiHelp needs JavaScript. Please turn it on in your browser.</p></noscript>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js?v=12"></script>
</body>
</html>
