<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>KiHelp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#14211f; --mute:#58686a; --line:#dbe5e5; --paper:#eef5f5; --card:#fff;
  --acc:#0e6b6b; --acc-ink:#fff; --soft:#d3ebe8; --coral:#e2573b;
  --disp:"Bricolage Grotesque",system-ui,sans-serif; --body:"Figtree",system-ui,sans-serif;
}
body.market{ --paper:#fdf5d3; --line:#eadfae; --acc:#f0a800; --acc-ink:#241800; --soft:#fbe2a0; --mute:#6b5f38; --ink:#241c06; }
body.dark{ --ink:#e6f0ef; --paper:#0e1616; --card:#172322; --line:#283a39; --mute:#8fa5a3; --acc:#33b8b0; --acc-ink:#03201f; --soft:#17403e; background:#050909; }
body.dark.market{ --paper:#17130a; --card:#221c0d; --line:#3a3114; --ink:#f6edd0; --mute:#b3a577; --acc:#f5b72a; --acc-ink:#241800; --soft:#4a3a0c; }
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font:16px/1.45 var(--body);color:var(--ink);background:#c9d3d3;transition:background .3s}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;text-align:inherit}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px;border-radius:6px}
svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

#app{position:relative;max-width:480px;height:100dvh;margin:0 auto;background:var(--paper);display:flex;flex-direction:column;overflow:hidden;transition:background .3s}
#head{display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 12px) 16px 10px;background:var(--paper);border-bottom:1px solid var(--line)}
.mark{font:800 26px/1 var(--disp);letter-spacing:-.03em}
.sect{font:600 13px var(--body);color:var(--mute);margin-top:3px}
.hbtn{display:flex;align-items:center;gap:6px;padding:9px 14px;border-radius:999px;background:var(--acc);color:var(--acc-ink);font-weight:600}
.ibtn{width:42px;height:42px;display:grid;place-items:center;border-radius:50%}
#main{flex:1;overflow-y:auto;padding-bottom:16px;scroll-behavior:smooth}

#nav{display:flex;background:var(--card);border-top:1px solid var(--line);padding:6px 4px calc(env(safe-area-inset-bottom) + 6px)}
#nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--mute);padding:2px 0}
#nav .pill{display:grid;place-items:center;width:52px;height:30px;border-radius:999px;transition:background .2s}
#nav button.on{color:var(--ink)}
#nav button.on .pill{background:var(--acc);color:var(--acc-ink)}
.dot{position:relative}.dot::after{content:"";position:absolute;top:-2px;right:-3px;width:9px;height:9px;border-radius:50%;background:var(--coral);border:2px solid var(--card)}

/* avatars + placeholder photos */
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none;font:700 16px var(--disp);color:#fff;background:hsl(var(--h) 50% 38%)}
.ph{background:radial-gradient(circle at 25% 30%,hsl(var(--h) 80% 78%) 0 14%,transparent 15%),linear-gradient(135deg,hsl(var(--h) 55% 58%),hsl(calc(var(--h) + 45) 55% 34%))}
img.m,video.m{width:100%;display:block;object-fit:cover}

/* stories */
.stories{display:flex;gap:14px;padding:14px 16px;overflow-x:auto;border-bottom:1px solid var(--line);scrollbar-width:none}
.story{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:12px;font-weight:500;flex:none;width:64px}
.ring{padding:3px;border-radius:50%;background:conic-gradient(var(--acc),var(--coral),var(--acc))}
.ring .av{border:3px solid var(--paper);width:56px;height:56px}
.ring.add{background:none;border:2px dashed var(--mute)}
.ring.add .av{background:var(--soft);color:var(--ink);border:0}

/* posts: full-bleed, hairline separated like a real feed */
.post{padding:14px 0 6px;border-bottom:1px solid var(--line)}
.ph-row{display:flex;gap:10px;align-items:center;padding:0 16px}
.ph-row b{display:block;line-height:1.2}.ph-row small{color:var(--mute)}
.ptext{padding:10px 16px 10px}
.pmedia{aspect-ratio:4/3;width:100%}
.acts{display:flex;gap:4px;padding:4px 10px}
.acts button{display:flex;gap:6px;align-items:center;padding:8px 10px;border-radius:999px;color:var(--mute);font-weight:600;font-size:14px}
.acts button.on{color:var(--coral)}.acts button.on svg{fill:currentColor}
.cmts{padding:0 16px 10px}
.cmt{padding:4px 0;font-size:15px}.cmt b{margin-right:6px}
.cin{display:flex;gap:8px;margin-top:6px}
.cin input{flex:1}

input,select,textarea{width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--card)}
textarea{resize:none;min-height:88px}

/* chat */
.thread{display:flex;gap:12px;align-items:center;width:100%;padding:12px 16px;border-bottom:1px solid var(--line)}
.thread .tx{flex:1;min-width:0}.thread b{display:block}
.thread span.l{display:block;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
.screen{position:absolute;inset:0;background:var(--paper);display:flex;flex-direction:column;z-index:20}
.screen header{display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 10px) 10px 10px;border-bottom:1px solid var(--line)}
.msgs{flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.bub{max-width:78%;padding:9px 13px;border-radius:18px 18px 18px 5px;background:var(--card);border:1px solid var(--line)}
.bub.me{align-self:flex-end;background:var(--acc);color:var(--acc-ink);border:0;border-radius:18px 18px 5px 18px}
.compose{display:flex;gap:8px;padding:10px 12px calc(env(safe-area-inset-bottom) + 10px);border-top:1px solid var(--line)}
.send{width:46px;height:46px;border-radius:50%;background:var(--acc);color:var(--acc-ink);display:grid;place-items:center;flex:none}

/* marketplace */
.msearch{padding:12px 16px 4px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:8px 16px;scrollbar-width:none}
.chip{flex:none;padding:7px 14px;border-radius:999px;border:1.5px solid var(--line);font-weight:600;font-size:14px;background:var(--card)}
.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 12px;padding:8px 16px}
.lc{display:block;width:100%;position:relative}
.lm{position:relative;aspect-ratio:1/1.08;border-radius:6px 22px 6px 22px;overflow:hidden}
.lm .ph,.lm img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tag{position:absolute;inset-inline-start:8px;bottom:8px;padding:3px 9px;border-radius:999px;background:var(--card);font-size:12px;font-weight:600}
.sv{position:absolute;inset-inline-end:6px;top:6px;width:34px;height:34px;border-radius:50%;background:var(--card);display:grid;place-items:center}
.sv.on{color:var(--coral)}.sv.on svg{fill:currentColor}
.lt{margin-top:7px;font-weight:600;line-height:1.25}
.lp{font:800 17px var(--disp)}
.ls{font-size:13px;color:var(--mute)}
.empty{grid-column:1/-1;text-align:center;padding:40px 10px;color:var(--mute)}

/* sheets */
#sheet{position:absolute;inset:0;z-index:30;display:none}
#sheet.open{display:block}
.bd{position:absolute;inset:0;background:rgba(10,20,20,.5)}
.panel{position:absolute;left:0;right:0;bottom:0;max-height:92%;overflow-y:auto;background:var(--paper);border-radius:26px 26px 0 0;padding:18px 18px calc(env(safe-area-inset-bottom) + 20px);animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.panel h2{font:800 24px/1.1 var(--disp);letter-spacing:-.02em;margin-bottom:12px}
.fld{margin-bottom:12px}.fld label{display:block;font-weight:600;font-size:14px;margin-bottom:5px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button{padding:10px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);font-weight:600;text-align:center}
.seg button.on{border-color:var(--ink);background:var(--soft)}
.btn{display:block;width:100%;padding:14px;border-radius:14px;background:var(--acc);color:var(--acc-ink);font-weight:700;text-align:center}
.btn.alt{background:var(--card);color:var(--ink);border:1.5px solid var(--line)}
.row2{display:grid;grid-template-columns:1fr 1.4fr;gap:10px;margin-top:12px}
.dm{aspect-ratio:4/3;border-radius:6px 26px 6px 26px;overflow:hidden;margin-bottom:12px;position:relative}
.dm .ph,.dm img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.big{font:800 28px var(--disp);letter-spacing:-.02em}
.note{background:var(--soft);padding:10px 12px;border-radius:12px;margin:10px 0;font-size:15px}
.sel{display:flex;gap:10px;align-items:center;margin:10px 0}
.up{display:flex;gap:10px;align-items:center;padding:12px;border:1.5px dashed var(--mute);border-radius:12px;font-weight:600;cursor:pointer}
.up img,.up video{width:56px;height:56px;border-radius:10px;object-fit:cover}

.item{display:flex;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);align-items:flex-start}
.item p{flex:1}.item small{color:var(--mute);display:block}
.stats{display:flex;gap:26px;padding:6px 16px 16px}
.stats b{display:block;font:800 22px var(--disp)}
.stats span{color:var(--mute);font-size:14px}
.prof{padding:22px 16px 8px;display:flex;gap:14px;align-items:center}
.prof .av{width:72px;height:72px;font-size:28px}
h3.sub{font:800 18px var(--disp);padding:8px 16px}

#toast{position:absolute;left:50%;bottom:92px;transform:translate(-50%,20px);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:999px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:50;white-space:nowrap}
#toast.show{opacity:1;transform:translate(-50%,0)}

.hr{display:flex;align-items:center;gap:4px}
.setbody{flex:1;overflow-y:auto;padding-bottom:30px}
.srow{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:14px 16px;border-bottom:1px solid var(--line)}
.srow.col{flex-direction:column;align-items:stretch;gap:10px}
.lbl{font-weight:600}
.seg.c3{grid-template-columns:repeat(3,1fr)}
.seg.c3 button{background:var(--card);color:var(--ink)}
.switch{width:54px;height:32px;border-radius:999px;background:var(--line);position:relative;flex:none;transition:background .2s;border:1.5px solid var(--mute)}
.switch i{position:absolute;top:3px;inset-inline-start:3px;width:22px;height:22px;border-radius:50%;background:var(--ink);transition:transform .2s}
.switch.on{background:var(--acc);border-color:var(--acc)}
.switch.on i{transform:translateX(22px);background:var(--acc-ink)}
[dir=rtl] .switch.on i{transform:translateX(-22px)}
.dots{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.dotb{width:38px;height:38px;border-radius:50%;border:3px solid var(--paper);box-shadow:0 0 0 2px var(--line)}
.dotb.on{box-shadow:0 0 0 3px var(--ink)}
.btn.sm{width:auto;padding:10px 16px;flex:none}
.saverph{display:grid;place-items:center;text-align:center;font-weight:600;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.6);width:100%;line-height:1.3}
.screen header .ttl{font:800 22px var(--disp)}
[dir=rtl] .flip svg{transform:scaleX(-1)}
body.saver *{animation:none!important;transition:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>

  ar: { name: 'العربية', home: 'الرئيسية', chat: 'الدردشة', market: 'السوق', alerts: 'الإشعارات', profile: 'حسابي', social: 'اجتماعي', chats: 'المحادثات', marketplace: 'السوق', post: 'نشر', sell: 'بيع', settings: 'الإعدادات', appearance: 'المظهر', mode: 'الوضع', system: 'النظام', light: 'فاتح', dark: 'داكن', accent: 'لون التمييز', auto: 'تلقائي', data: 'البيانات والتخزين', saver: 'توفير البيانات', saverDesc: 'تُحمَّل الصور والفيديوهات عند الضغط عليها فقط', storage: 'التخزين المستخدم', clear: 'مسح الذاكرة المؤقتة', cleared: 'تم مسح الذاكرة المؤقتة', language: 'اللغة', search: 'ابحث عن منتجات', mine: 'منتجاتك', account: 'الحساب', logout: 'تسجيل الخروج' },
  fr: { name: 'Français', home: 'Accueil', chat: 'Discussions', market: 'Marché', alerts: 'Alertes', profile: 'Profil', social: 'Social', chats: 'Discussions', marketplace: 'Marché', post: 'Publier', sell: 'Vendre', settings: 'Réglages', appearance: 'Apparence', mode: 'Mode', system: 'Système', light: 'Clair', dark: 'Sombre', accent: "Couleur d'accent", auto: 'Auto', data: 'Données et stockage', saver: 'Économiseur de données', saverDesc: 'Les photos et vidéos ne se chargent que si vous les touchez', storage: 'Stockage utilisé', clear: 'Vider le cache', cleared: 'Cache vidé', language: 'Langue', search: 'Rechercher des articles', mine: 'Vos annonces', account: 'Compte', logout: 'Se déconnecter' },
  es: { name: 'Español', home: 'Inicio', chat: 'Chat', market: 'Mercado', alerts: 'Avisos', profile: 'Perfil', social: 'Social', chats: 'Chats', marketplace: 'Mercado', post: 'Publicar', sell: 'Vender', settings: 'Ajustes', appearance: 'Apariencia', mode: 'Modo', system: 'Sistema', light: 'Claro', dark: 'Oscuro', accent: 'Color de acento', auto: 'Auto', data: 'Datos y almacenamiento', saver: 'Ahorro de datos', saverDesc: 'Las fotos y los videos se cargan solo al tocarlos', storage: 'Almacenamiento usado', clear: 'Borrar caché', cleared: 'Caché borrada', language: 'Idioma', search: 'Buscar artículos', mine: 'Tus artículos', account: 'Cuenta', logout: 'Cerrar sesión' },
  sw: { name: 'Kiswahili', home: 'Mwanzo', chat: 'Gumzo', market: 'Soko', alerts: 'Arifa', profile: 'Wasifu', social: 'Jamii', chats: 'Mazungumzo', marketplace: 'Soko', post: 'Chapisha', sell: 'Uza', settings: 'Mipangilio', appearance: 'Mwonekano', mode: 'Hali', system: 'Mfumo', light: 'Mwanga', dark: 'Giza', accent: 'Rangi kuu', auto: 'Otomatiki', data: 'Data na hifadhi', saver: 'Kiokoa data', saverDesc: 'Picha na video hupakiwa unapozigusa tu', storage: 'Hifadhi inayotumika', clear: 'Futa kache', cleared: 'Kache imefutwa', language: 'Lugha', search: 'Tafuta bidhaa', mine: 'Bidhaa zako', account: 'Akaunti', logout: 'Toka' }
};
const tr = k => (LANGS[S.lang] && LANGS[S.lang][k]) || LANGS.en[k] || k;
const TABS = [['home', 'home', 'home'], ['chat', 'chat', 'chat'], ['market', 'market', 'shop'], ['alerts', 'alerts', 'bell'], ['me', 'profile', 'user']];

function head() {
  const t = S.tab;
  const title = tr({ home: 'social', chat: 'chats', market: 'marketplace', alerts: 'alerts', me: 'profile' }[t]);
  const act = t === 'home' ? `<button class="hbtn" data-a="newpost">${I.plus}${tr('post')}</button>`
    : t === 'market' ? `<button class="hbtn" data-a="sell">${I.plus}${tr('sell')}</button>` : '';
  return `<div><div class="mark">KiHelp</div><div class="sect">${title}</div></div><div class="hr">${act}<button class="ibtn" data-a="settings" aria-label="${tr('settings')}">${I.sliders}</button></div>`;
}

function viewHome() {
  const stories = `<div class="stories"><button class="story" data-a="story"><span class="ring add">${av('You').replace('>Y<', '>+<')}</span>Your story</button>${
    ['Hana', 'Yonas', 'Meron', 'Dawit', 'Selam'].map(n => `<button class="story" data-a="story"><span class="ring">${av(n)}</span>${n}</button>`).join('')}</div>`;
  const posts = S.posts.map(p => `
    <article class="post">
      <div class="ph-row">${av(p.who)}<div><b>${esc(p.who)}</b><small>${p.t}</small></div></div>
      <p class="ptext">${esc(p.text)}</p>
      ${p.media ? smedia(p.media, 'pmedia', 'p' + p.id) : `<div class="ph pmedia" style="--h:${p.h}"></div>`}
      <div class="acts">
        <button class="${p.liked ? 'on' : ''}" data-a="like" data-id="${p.id}" aria-label="Like">${I.heart}${p.likes}</button>
        <button data-a="cmt" data-id="${p.id}" aria-label="Comments">${I.cmt}${p.cm.length}</button>
        <button data-a="share" aria-label="Share">${I.share}Share</button>
      </div>
      ${S.open.has(p.id) ? `<div class="cmts">${p.cm.map(c => `<div class="cmt"><b>${esc(c.w)}</b>${esc(c.t)}</div>`).join('')}
        <div class="cin"><input id="ci${p.id}" placeholder="Write a comment" maxlength="200"><button class="send" data-a="addcmt" data-id="${p.id}" aria-label="Send comment">${I.send}</button></div></div>` : ''}
    </article>`).join('');
  return stories + posts;
}

function viewChat() {
  return S.threads.map(t => {
    const last = t.msgs[t.msgs.length - 1];
    return `<button class="thread" data-a="thread" data-id="${esc(t.id)}">${av(t.id, 48)}<span class="tx"><b>${esc(t.id)}</b><span class="l">${last ? (last.me ? 'You: ' : '') + esc(last.t) : 'Say hello'}</span></span></button>`;
  }).join('');
}

function listingCard(l) {
  const price = l.opt === 'auction' ? 'Bid ' + fmt(l.price) : fmt(l.price) + (l.opt === 'bulk' ? ' / kg' : '');
  return `<div class="lc"><div class="lm" data-a="listing" data-id="${l.id}" role="button" tabindex="0">
      ${l.media ? smedia(l.media, '', 'l' + l.id) : `<div class="ph" style="--h:${l.h}"></div>`}
      <span class="tag">${OPT[l.opt]}</span></div>
    <button class="sv ${S.saved.has(l.id) ? 'on' : ''}" style="position:absolute;margin:-0px" data-a="save" data-id="${l.id}" aria-label="Save item">${I.save}</button>
    <button class="lt" data-a="listing" data-id="${l.id}" style="display:block;width:100%">${esc(l.title)}</button>
    <div class="lp">${price}</div><div class="ls">${esc(l.who)} · ${l.cat}</div></div>`;
}
function gridHTML() {
  const q = S.q.trim().toLowerCase();
  const items = S.listings.filter(l => (S.cat === 'All' || l.cat === S.cat) && (S.opt === 'all' || l.opt === S.opt) && (!q || l.title.toLowerCase().includes(q)));
  return items.length ? items.map(listingCard).join('') : `<div class="empty">No items match. Clear the filters or tap Sell to add the first one.</div>`;
}
function viewMarket() {
  return `<div class="msearch"><input id="q" type="search" placeholder="${tr('search')}" value="${esc(S.q)}" aria-label="${tr('search')}"></div>
    <div class="chips" id="cats">${CATS.map(c => `<button class="chip ${S.cat === c ? 'on' : ''}" data-a="cat" data-id="${c}">${c}</button>`).join('')}</div>
    <div class="chips" id="opts">${[['all', 'Any price type'], ...Object.entries(OPT)].map(([k, v]) => `<button class="chip ${S.opt === k ? 'on' : ''}" data-a="opt" data-id="${k}">${v}</button>`).join('')}</div>
    <div class="grid" id="grid">${gridHTML()}</div>`;
}

function viewAlerts() {
  return S.notes.map(n => `<div class="item">${av('Hana').replace(/--h:\d+/, '--h:' + n[2])}<p>${esc(n[0])}<small>${n[1]}</small></p></div>`).join('');
}

function viewMe() {
  const mine = S.listings.filter(l => l.who === 'You');
  return `<div class="prof">${av('You')}<div><div class="big">Your name</div><div class="ls">Edit profile in settings</div></div></div>
    <div class="stats"><div><b>${S.posts.filter(p => p.who === 'You').length}</b><span>Posts</span></div><div><b>128</b><span>Friends</span></div><div><b>${mine.length}</b><span>Listings</span></div></div>
    <h3 class="sub">${tr('mine')}</h3>
    ${mine.length ? `<div class="grid">${mine.map(listingCard).join('')}</div>` : `<div class="empty" style="padding:20px 16px">Nothing for sale yet. Tap Market, then Sell.</div>`}`;
}

function render(keepScroll) {
  const top = $('#main').scrollTop;
  document.body.classList.toggle('market', S.tab === 'market');
  $('#head').innerHTML = head();
  $('#head').style.cssText = '';
  $('#main').innerHTML = { home: viewHome, chat: viewChat, market: viewMarket, alerts: viewAlerts, me: viewMe }[S.tab]();
  $('#nav').innerHTML = TABS.map(([k, l, i]) => `<button class="${S.tab === k ? 'on' : ''}" data-a="tab" data-id="${k}" aria-label="${tr(l)}"><span class="pill ${k === 'alerts' ? 'dot' : ''}">${I[i]}</span>${tr(l)}</button>`).join('');
  $('#main').scrollTop = keepScroll ? top : 0;
}

/* ---------- sheets, chat, toast ---------- */
function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 2200); }
function sheet(html) { $('#sheet').innerHTML = `<div class="bd" data-a="close"></div><div class="panel" role="dialog">${html}</div>`; $('#sheet').classList.add('open'); }
function closeSheet() { $('#sheet').classList.remove('open'); $('#sheet').innerHTML = ''; S.draft = null; }

function openThread(id, draft) {
  let t = S.threads.find(x => x.id === id);
  if (!t) { t = { id, msgs: [] }; S.threads.unshift(t); }
  $('#over').innerHTML = `<div class="screen"><header><button class="ibtn flip" data-a="back" aria-label="Back">${I.back}</button>${av(id, 38)}<b>${esc(id)}</b></header>
    <div class="msgs" id="msgs"></div>
    <div class="compose"><input id="mi" placeholder="Message" maxlength="500" value="${esc(draft || '')}"><button class="send" data-a="send" data-id="${esc(id)}" aria-label="Send">${I.send}</button></div></div>`;
  paintMsgs(t); setTimeout(() => $('#mi').focus(), 50);
}
function paintMsgs(t) { const m = $('#msgs'); if (!m) return; m.innerHTML = t.msgs.length ? t.msgs.map(x => `<div class="bub ${x.me ? 'me' : ''}">${esc(x.t)}</div>`).join('') : `<div class="empty">Start the conversation.</div>`; m.scrollTop = m.scrollHeight; }
function sendMsg(id) {
  const i = $('#mi'), v = i.value.trim(); if (!v) return;
  const t = S.threads.find(x => x.id === id); t.msgs.push({ me: 1, t: v }); i.value = ''; paintMsgs(t);
  setTimeout(() => { t.msgs.push({ me: 0, t: ['Yes, still available.', 'Sure, when can you come?', 'Let me check and get back to you.'][t.msgs.length % 3] }); paintMsgs(t); }, 1200);
}

function uploadField(accept, label) {
  return `<label class="up"><input type="file" id="file" accept="${accept}" hidden><span id="prev">${I.plus}</span>${label}</label>`;
}
function bindUpload() {
  const f = $('#file'); if (!f) return;
  f.onchange = () => {
    const file = f.files[0]; if (!file) return;
    const type = file.type.startsWith('video') ? 'video' : 'image', url = URL.createObjectURL(file);
    S.draft = { type, url };
    $('#prev').innerHTML = type === 'video' ? `<video src="${url}" muted></video>` : `<img src="${url}" alt="Selected photo">`;
  };
}

function applyTheme() {
  const dark = S.mode === 'dark' || (S.mode === 'system' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
  const b = document.body, st = b.style;
  b.classList.toggle('dark', dark); b.classList.toggle('saver', S.saver);
  const A = { teal: ['#0e6b6b', '#ffffff'], saffron: ['#f0a800', '#241800'], violet: ['#6b46c9', '#ffffff'], rose: ['#d6336c', '#ffffff'] };
  if (A[S.accent]) { st.setProperty('--acc', A[S.accent][0]); st.setProperty('--acc-ink', A[S.accent][1]); st.setProperty('--soft', 'color-mix(in srgb, var(--acc) 24%, var(--paper))'); }
  else ['--acc', '--acc-ink', '--soft'].forEach(k => st.removeProperty(k));
  document.documentElement.lang = S.lang; document.documentElement.dir = S.lang === 'ar' ? 'rtl' : 'ltr';
}
async function showUsage() {
  const el = $('#usage'); if (!el) return;
  try { const e = await navigator.storage.estimate(); el.textContent = (e.usage / 1048576).toFixed(1) + ' MB'; } catch (x) { el.textContent = '-'; }
}
async function clearCache() {
  try { if (window.caches) for (const k of await caches.keys()) await caches.delete(k); } catch (e) {}
  S.loaded.clear(); S.q = ''; S.cat = 'All'; S.opt = 'all';
  toast(tr('cleared')); showUsage();
}
function openSettings() {
  const scroll = document.querySelector('.setbody')?.scrollTop || 0;
  const sw = (on, a) => `<button class="switch ${on ? 'on' : ''}" role="switch" aria-checked="${on}" data-a="${a}"><i></i></button>`;
  const AC = { teal: '#0e6b6b', saffron: '#f0a800', violet: '#6b46c9', rose: '#d6336c' };
  $('#over').innerHTML = `<div class="screen"><header><button class="ibtn flip" data-a="back" aria-label="Back">${I.back}</button><b class="ttl">${tr('settings')}</b></header>
  <div class="setbody">
    <h3 class="sub">${tr('appearance')}</h3>
    <div class="srow col"><div class="lbl">${tr('mode')}</div><div class="seg c3">${['system', 'light', 'dark'].map(m => `<button class="${S.mode === m ? 'on' : ''}" data-a="mode" data-id="${m}">${tr(m)}</button>`).join('')}</div></div>
    <div class="srow col"><div class="lbl">${tr('accent')}</div><div class="dots">
      <button class="chip ${S.accent === 'auto' ? 'on' : ''}" data-a="accent" data-id="auto">${tr('auto')}</button>
      ${Object.entries(AC).map(([k, c]) => `<button class="dotb ${S.accent === k ? 'on' : ''}" style="background:${c}" data-a="accent" data-id="${k}" aria-label="${k}"></button>`).join('')}</div></div>
    <h3 class="sub">${tr('data')}</h3>
    <div class="srow"><div><div class="lbl">${tr('saver')}</div><div class="ls">${tr('saverDesc')}</div></div>${sw(S.saver, 'togglesaver')}</div>
    <div class="srow"><div><div class="lbl">${tr('storage')}</div><div class="ls" id="usage">...</div></div><button class="btn sm" data-a="clearcache">${tr('clear')}</button></div>
    <h3 class="sub">${tr('language')}</h3>
    <div class="srow col"><select id="lang" aria-label="${tr('language')}">${Object.entries(LANGS).map(([k, v]) => `<option value="${k}" ${S.lang === k ? 'selected' : ''}>${v.name}</option>`).join('')}</select></div>
    <h3 class="sub">${tr('account')}</h3>
    <div class="srow"><button class="lbl" data-a="logout" style="color:var(--coral)">${tr('logout')}</button></div>
    <div class="ls" style="padding:16px">KiHelp 0.2</div>
  </div></div>`;
  document.querySelector('.setbody').scrollTop = scroll;
  showUsage();
}

const ACT = {
  settings: () => openSettings(),
  mode: id => { S.mode = id; saveSettings(); applyTheme(); openSettings(); },
  accent: id => { S.accent = id; saveSettings(); applyTheme(); openSettings(); },
  togglesaver: () => { S.saver = !S.saver; S.loaded.clear(); saveSettings(); applyTheme(); openSettings(); },
  clearcache: () => clearCache(),
  logout: () => toast('Login arrives with Supabase'),
  load: id => { S.loaded.add(id); render(true); },
  tab: id => { S.tab = id; render(); },
  like: id => { const p = S.posts.find(x => x.id == id); p.liked = !p.liked; p.likes += p.liked ? 1 : -1; render(true); },
  cmt: id => { id = +id; S.open.has(id) ? S.open.delete(id) : S.open.add(id); render(true); },
  addcmt: id => { const v = $('#ci' + id).value.trim(); if (!v) return; S.posts.find(x => x.id == id).cm.push({ w: 'You', t: v }); render(true); },
  share: () => toast('Link copied'),
  story: () => toast('Stories open full screen'),
  thread: id => openThread(id),
  back: () => { $('#over').innerHTML = ''; render(true); },
  send: id => sendMsg(id),
  cat: id => { S.cat = id; $('#cats').innerHTML = CATS.map(c => `<button class="chip ${S.cat === c ? 'on' : ''}" data-a="cat" data-id="${c}">${c}</button>`).join(''); $('#grid').innerHTML = gridHTML(); },
  opt: id => { S.opt = id; $('#opts').innerHTML = [['all', 'Any price type'], ...Object.entries(OPT)].map(([k, v]) => `<button class="chip ${S.opt === k ? 'on' : ''}" data-a="opt" data-id="${k}">${v}</button>`).join(''); $('#grid').innerHTML = gridHTML(); },
  save: id => { id = +id; S.saved.has(id) ? S.saved.delete(id) : S.saved.add(id); toast(S.saved.has(id) ? 'Saved' : 'Removed from saved'); S.tab === 'market' ? $('#grid').innerHTML = gridHTML() : render(true); },
  close: closeSheet,

  listing: id => {
    const l = S.listings.find(x => x.id == id);
    const price = l.opt === 'auction' ? `<div class="ls">Current bid</div><div class="big">${fmt(l.price)}</div>` : `<div class="big">${fmt(l.price)}${l.opt === 'bulk' ? ' / kg' : ''}</div>`;
    const info = { fixed: 'The seller set one price.', nego: 'Price can be discussed. Send an offer in chat.', auction: 'Highest bid wins when the auction ends.', bulk: l.note || '' }[l.opt];
    const primary = { fixed: ['order', 'Order now'], bulk: ['order', 'Order now'], nego: ['offer', 'Make an offer'], auction: ['bid', 'Place bid'] }[l.opt];
    sheet(`<div class="dm">${l.media ? media(l.media, '') : `<div class="ph" style="--h:${l.h}"></div>`}</div>
      <h2>${esc(l.title)}</h2>${price}
      <div class="note"><b>${OPT[l.opt]}.</b> ${esc(info)}</div>
      <p>${esc(l.desc)}</p>
      <div class="sel">${av(l.who, 36)}<div><b>${esc(l.who)}</b><div class="ls">${l.cat}</div></div></div>
      ${l.opt === 'auction' ? `<div class="fld"><label for="bidv">Your bid (Birr)</label><input id="bidv" type="number" inputmode="numeric" placeholder="More than ${l.price}"></div>` : ''}
      <button class="btn" data-a="${primary[0]}" data-id="${l.id}">${primary[1]}</button>
      <div class="row2"><button class="btn alt" data-a="save" data-id="${l.id}">${S.saved.has(l.id) ? 'Saved' : 'Save'}</button>
      <button class="btn alt" data-a="msgseller" data-id="${l.id}">Message seller</button></div>`);
  },
  msgseller: id => { const l = S.listings.find(x => x.id == id); closeSheet(); openThread(l.who, `Hi, is "${l.title}" still available?`); },
  offer: id => { const l = S.listings.find(x => x.id == id); closeSheet(); openThread(l.who, `Hi, would you take ___ Birr for "${l.title}"?`); },
  order: id => { closeSheet(); toast('Order sent to seller'); },
  bid: id => {
    const l = S.listings.find(x => x.id == id), v = +$('#bidv').value;
    if (!v || v <= l.price) return toast('Bid must be higher than ' + fmt(l.price));
    l.price = v; closeSheet(); toast('Bid placed: ' + fmt(v)); if (S.tab === 'market') $('#grid').innerHTML = gridHTML();
  },

  sell: () => {
    S.sellOpt = 'fixed';
    sheet(`<h2>Sell an item</h2>
      <div class="fld">${uploadField('image/*', 'Add a photo')}</div>
      <div class="fld"><label for="st">What are you selling?</label><input id="st" maxlength="60" placeholder="e.g. Wooden chair"></div>
      <div class="fld"><label>How do you want to price it?</label><div class="seg" id="so">${Object.entries(OPT).map(([k, v]) => `<button data-a="sopt" data-id="${k}" class="${k === 'fixed' ? 'on' : ''}">${v}</button>`).join('')}</div></div>
      <div class="fld"><label for="sp">Price (Birr)</label><input id="sp" type="number" inputmode="numeric" placeholder="0"></div>
      <div class="fld"><label for="sc">Category</label><select id="sc">${CATS.slice(1).map(c => `<option>${c}</option>`).join('')}</select></div>
      <div class="fld"><label for="sd">Description</label><textarea id="sd" maxlength="300" placeholder="Condition, size, pickup or delivery"></textarea></div>
      <button class="btn" data-a="publish">Publish item</button>`);
    bindUpload();
  },
  sopt: id => { S.sellOpt = id; document.querySelectorAll('#so button').forEach(b => b.classList.toggle('on', b.dataset.id === id)); },
  publish: () => {
    const title = $('#st').value.trim(), price = +$('#sp').value;
    if (!title) return toast('Add a title');
    if (!price) return toast('Add a price');
    S.listings.unshift({ id: Date.now(), title, price, opt: S.sellOpt, cat: $('#sc').value, who: 'You', h: Math.floor(Math.random() * 360), desc: $('#sd').value.trim() || 'No description.', media: S.draft?.type === 'image' ? S.draft : null });
    closeSheet(); S.cat = 'All'; S.opt = 'all'; S.q = ''; render(); toast('Published');
  },

  newpost: () => {
    sheet(`<h2>New post</h2>
      <div class="fld"><textarea id="pt" maxlength="400" placeholder="What's on your mind?"></textarea></div>
      <div class="fld">${uploadField('image/*,video/*', 'Add a photo or video')}</div>
      <button class="btn" data-a="publishpost">Post</button>`);
    bindUpload();
  },
  publishpost: () => {
    const text = $('#pt').value.trim();
    if (!text && !S.draft) return toast('Write something or add media');
    S.posts.unshift({ id: Date.now(), who: 'You', t: 'now', text, h: Math.floor(Math.random() * 360), likes: 0, liked: false, cm: [], media: S.draft });
    S.draft = null; closeSheet(); render(); toast('Posted');
  }
};

document.addEventListener('click', e => {
  const a = e.target.closest('[data-a]'); if (!a) return;
  if (a.classList.contains('bd') && e.target !== a) return;
  ACT[a.dataset.a]?.(a.dataset.id, a);
});
document.addEventListener('input', e => { if (e.target.id === 'q') { S.q = e.target.value; $('#grid').innerHTML = gridHTML(); } });
document.addEventListener('change', e => { if (e.target.id === 'lang') { S.lang = e.target.value; saveSettings(); applyTheme(); render(true); openSettings(); } });
if (window.matchMedia) matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', () => { if (S.mode === 'system') applyTheme(); });
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.id === 'mi') document.querySelector('[data-a="send"]').click();
  if (e.key === 'Enter' && e.target.matches('.lm')) e.target.click();
  if (e.key === 'Escape') closeSheet();
});
applyTheme();
render();
</script>
</body>
</html>
